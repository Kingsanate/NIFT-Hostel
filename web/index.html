<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NIFT Hostel Shillong — Smart Student Hostel Management System. Manage students, attendance, events, medical records and more.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NIFT Hostel">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=3">

  <!-- Favicons & App Icons (cache-busting ?v=3 forces browser to drop cached Flutter logo) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3">
  <meta name="theme-color" content="#0F1117">

  <title>NIFT Hostel — Smart Student Management</title>
  <link rel="manifest" href="manifest.json?v=3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <style>
    html, body { margin: 0; padding: 0; background: #EEF0F4; }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #EEF0F4;
      transition: opacity 0.2s ease;
      z-index: 99999;
    }
    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(29, 78, 216, 0.15);
      border-top-color: #1D4ED8;
      border-radius: 50%;
      animation: nift-spin 0.65s linear infinite;
    }
    @keyframes nift-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- PDF.js: required for the `printing` package to render PDF previews on web. Deferred so it never blocks app startup. -->
  <script>var dartPdfJsVersion = "3.2.146";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.2.146/pdf.min.js" defer></script>
</head>
<body>
  <div id="loading-indicator">
    <div class="loader-spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 200);
      }
    });
  </script>
</body>
</html>
